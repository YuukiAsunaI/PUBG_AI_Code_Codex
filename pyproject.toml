[project]
name = "pubg-ai-code-codex"
version = "0.1.0"
description = "Local-first PUBG Open API analytics tooling"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
desktop = ["pywebview>=5.4"]
desktop-build = ["pywebview>=5.4", "pyinstaller>=6.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubg_ai = ["assets/*.png", "assets/*.ico"]
